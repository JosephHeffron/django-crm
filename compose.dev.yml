# Local/staging use, per docs/ARCHITECTURE.md's "Container
# architecture" section — for testing the containerized stack itself
# (does the image build and run correctly, does the full Caddy →
# Django → PostgreSQL path actually work, does Postgres persist data
# across a restart, and so on), not a replacement for this project's
# actual day-to-day dev workflow, which stays native (pyenv + a
# locally-installed PostgreSQL, `manage.py runserver`) as established
# since Phase 0. `web` still runs the same production-configured image
# as compose.prod.yml (DJANGO_SETTINGS_MODULE is baked into the
# Containerfile). Differences from compose.prod.yml: `db` publishes a
# host port (direct `psql` access is genuinely useful while testing),
# `web` does not (requests reach it through Caddy, same as production
# — testing the real path, not a shortcut around it), and `caddy` uses
# Caddyfile.dev (`tls internal` — there's no real public domain to
# request a Let's Encrypt certificate for locally).
#
# Usage: podman-compose -f compose.dev.yml up -d
# Requires a real .env (copy .env.example, fill in real values) —
# never commit .env.

services:
  db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    env_file: .env
    # Host port 5433, not 5432 — this project's native day-to-day dev
    # workflow (pyenv + manage.py runserver, per docs/ARCHITECTURE.md)
    # keeps a locally-installed PostgreSQL running on 5432 at the same
    # time as this compose stack; publishing 5432 here would collide
    # with it. Confirmed by actually hitting "address already in use"
    # against the running local postgresql.service.
    ports:
      - "5433:5432"
    volumes:
      # See compose.prod.yml's matching comment — postgres:18+ expects
      # a single mount at /var/lib/postgresql, not .../data.
      - postgres_data_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_files_dev:/app/staticfiles
      - media_files_dev:/app/media
    healthcheck:
      # See compose.prod.yml's matching comment — /health/ (Phase 12)
      # checks real PostgreSQL connectivity, not just that gunicorn
      # accepts TCP connections.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: docker.io/library/caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    # Mapped to non-privileged host ports (8080/8443, not 80/443) —
    # rootless Podman can't bind <1024 on the host without extra
    # capability grants this local/staging use has no reason to need.
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      # :Z relabels the bind-mounted file for this container's exclusive
      # SELinux access — without it, Fedora's enforcing SELinux denies
      # the read ("permission denied" reading the Caddyfile) even though
      # plain Unix file permissions allow it. Confirmed by hitting that
      # exact denial with the mount unlabeled. Named volumes below don't
      # need this — Podman labels those itself.
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro,Z
      - static_files_dev:/srv/static:ro
      - media_files_dev:/srv/media:ro
      - caddy_data_dev:/data
      - caddy_config_dev:/config

volumes:
  postgres_data_dev:
  static_files_dev:
  media_files_dev:
  caddy_data_dev:
  caddy_config_dev:
