{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-block">Log in</button>
  </form>
  <p><a href="{% url 'users:password_reset' %}">Forgotten your password?</a></p>
{% endblock %}
