{% extends "base.html" %}

{% block title %}Reset your password{% endblock %}

{% block content %}
  <h1>Reset your password</h1>
  <p>Enter the email address on your account and we'll send you a link to set a new password.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-block">Send the link</button>
  </form>
  <p><a href="{% url 'users:login' %}">Back to sign in</a></p>
{% endblock %}
