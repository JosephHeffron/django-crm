{% extends "base.html" %}

{% block title %}Edit profile{% endblock %}

{% block content %}
  <div class="page-header">
    <h1>Edit profile</h1>
  </div>
  <form method="post" class="card">
    {% csrf_token %}
    {{ account_form.as_p }}
    {{ profile_form.as_p }}
    <div class="cluster">
      <button type="submit">Save</button>
      <a class="btn btn-secondary" href="{% url 'people:profile' %}">Cancel</a>
    </div>
  </form>
{% endblock %}
