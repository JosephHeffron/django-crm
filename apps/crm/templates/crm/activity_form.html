{% extends "base.html" %}

{% block title %}Log activity{% endblock %}

{% block content %}
  <div class="page-header">
    <div>
      <h1>Log activity</h1>
      <p class="page-subtitle">A call, a visit, an email or a note against a customer</p>
    </div>
    <div class="page-actions">
      {% include "partials/_save_button.html" with form_id="activity-form" %}
    </div>
  </div>
  <form id="activity-form" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a href="{{ cancel_url }}">Cancel</a>
  </form>
{% endblock %}
