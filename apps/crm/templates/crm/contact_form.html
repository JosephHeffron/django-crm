{% extends "base.html" %}

{% block title %}{% if object %}Edit {{ object }}{% else %}Add contact{% endif %}{% endblock %}

{% block content %}
  <h1>{% if object %}Edit {{ object }}{% else %}Add contact{% endif %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a href="{% if object %}{{ object.get_absolute_url }}{% else %}{% url 'crm:contact_list' %}{% endif %}">Cancel</a>
  </form>
{% endblock %}
