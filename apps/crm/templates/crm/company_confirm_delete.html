{% extends "base.html" %}

{% block title %}Delete {{ object.name }}{% endblock %}

{% block content %}
  <h1>Delete {{ object.name }}?</h1>
  <p>This can't be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Delete</button>
    <a href="{{ object.get_absolute_url }}">Cancel</a>
  </form>
{% endblock %}
