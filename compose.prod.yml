# Production stack, per docs/ARCHITECTURE.md's "Container architecture"
# section — all three containers: Caddy (HTTPS termination, reverse
# proxy, static/media serving; the only container reachable from
# outside the host), Django (`web`, no published port — Caddy reaches
# it over the internal Podman network), PostgreSQL.
#
# Usage: podman-compose -f compose.prod.yml up -d
# Requires a real .env (copy .env.example, fill in real values) —
# never commit .env. Requires DJANGO_ALLOWED_HOSTS to be a real public
# domain that resolves here — Caddy uses it both as the site address
# and to request a real Let's Encrypt certificate for it.

services:
  db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      # postgres:18+'s official image expects a single mount at
      # /var/lib/postgresql (not the pre-18 .../data convention) — it
      # places data in a major-version-specific subdirectory itself,
      # for pg_ctlcluster-style layout and future pg_upgrade support.
      # Confirmed by actually hitting the image's own startup error
      # when this was still pointed at .../data.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides .env's POSTGRES_HOST/POSTGRES_PORT (meant for native
      # local dev, where Postgres is reachable at localhost) with the
      # compose network's own service-discovery name for `db`.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    healthcheck:
      # /health/ (Phase 12, apps/core/views.py) actually checks
      # PostgreSQL connectivity, not just that gunicorn is accepting
      # TCP connections (Phase 7's original, narrower check) — a real
      # HTTP request via urllib (stdlib, avoids adding curl/wget to
      # the image just for this), same reasoning as the original.
      # urlopen raises on a non-2xx status, so a 503 from the view
      # itself correctly fails this check too.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: docker.io/library/caddy:2.11.4-alpine
    restart: unless-stopped
    env_file: .env
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # :Z relabels the bind-mounted file for this container's exclusive
      # SELinux access — without it, Fedora's enforcing SELinux denies
      # the read ("permission denied" reading the Caddyfile) even though
      # plain Unix file permissions allow it. Confirmed against
      # compose.dev.yml's identical mount; applies equally here. Named
      # volumes below don't need this — Podman labels those itself.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      # Read-only: Caddy only ever reads these files (Django writes
      # them via collectstatic / user uploads), never writes to them.
      - static_files:/srv/static:ro
      - media_files:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  static_files:
  media_files:
  # Caddy's own certificate storage and internal state — a named
  # volume so a container recreation doesn't force re-issuing a real
  # Let's Encrypt certificate every time (rate-limited by the CA).
  caddy_data:
  caddy_config:
