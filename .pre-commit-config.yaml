repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Vendored assets are kept byte-for-byte as upstream ships them,
      # so the whitespace hooks skip them. Every other hook here still
      # applies to them — including the size limit below, which is the
      # one that matters for a vendored bundle.
      - id: trailing-whitespace
        exclude: ^static/vendor/
      - id: end-of-file-fixer
        exclude: ^static/vendor/
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        # --enforce-all because the name is misleading: by default this
        # only weighs files being *added*, so replacing a vendored
        # bundle with a 10MB one would sail through. The biggest thing
        # tracked here is leaflet.js at 148KB, so nothing existing is
        # near the limit. Sourcery caught the gap on PR #169.
        args: [--maxkb=2048, --enforce-all]
      - id: detect-private-key
      - id: check-merge-conflict
