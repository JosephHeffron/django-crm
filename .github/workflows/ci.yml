name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: django_crm
          POSTGRES_USER: django_crm
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ci-only-secret-key
      POSTGRES_DB: django_crm
      POSTGRES_USER: django_crm
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v7
        with:
          # On a pull request, HEAD is GitHub's test merge commit and
          # HEAD^1 is the tip of the base branch, so two commits of
          # history are enough to list exactly what the PR changes.
          fetch-depth: 2

      # Website-only pull requests run the website's own checks instead
      # of the whole suite (docs/decisions/0017-the-website-lives-in-this-repository.md,
      # plan D6.5). Deliberately decided here, inside the job, and never
      # with `paths`/`paths-ignore` on the trigger: a required check
      # that does not run is reported as missing, not passed, and the
      # PR could never merge. scripts/change-scope.sh is the one rule,
      # shared with `deploy.sh --website-only`; it answers `full` for
      # anything outside website/, for website/partials/ (Django reads
      # those), and for an empty list. Pushes to main always run in full.
      - name: Decide what this change needs
        id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            scope=$(git diff --name-only --no-renames HEAD^1 HEAD | sh scripts/change-scope.sh)
          else
            scope=full
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "This change needs the $scope checks."

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # The private-media guards in apps/jobs/tests/test_private_media.py
      # run `caddy adapt` and assert on the configuration Caddy will
      # actually use. They skip without the binary, and skipping is how
      # this control was lost once already: a text-only version of those
      # tests passed while every private job photo was publicly
      # readable. Pinned and checksummed, like static/vendor/leaflet/.
      - name: Install Caddy (for the proxy-config tests)
        env:
          CADDY_VERSION: 2.11.7
          CADDY_SHA512: a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7
        run: |
          set -euo pipefail
          archive="caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/${archive}"
          echo "${CADDY_SHA512}  ${archive}" | sha512sum --check --strict
          tar -xzf "$archive" caddy
          sudo install -m 0755 caddy /usr/local/bin/caddy
          rm -f "$archive" caddy
          caddy version

      - name: Django check
        run: python manage.py check

      - name: Migration check
        if: steps.scope.outputs.scope != 'website'
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        if: steps.scope.outputs.scope != 'website'
        run: python manage.py migrate

      - name: Test
        if: steps.scope.outputs.scope != 'website'
        run: python manage.py test

      # The private-data guard, the page and link checks, and the
      # `caddy adapt` routing checks for the website hostnames — all in
      # one module, none of which needs the database.
      - name: Test (website only)
        if: steps.scope.outputs.scope == 'website'
        run: python manage.py test apps.core.tests.test_website

      - name: Lint
        run: |
          ruff check .
          ruff format --check .
