[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# Django's standard settings-split pattern: development.py/production.py
# intentionally re-export everything from base.py via wildcard import.
"config/settings/development.py" = ["F403"]
"config/settings/production.py" = ["F403", "F405"]
"**/migrations/*.py" = ["E501"]
